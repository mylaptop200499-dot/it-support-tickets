
name: Sync Code to Vercel Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-to-vercel
  cancel-in-progress: false

env:
  SOURCE_REPO: ${{ vars.SOURCE_REPO }}
  DESTINATION_REPO: ${{ vars.DESTINATION_REPO }}

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Validate Configuration
        run: |
          if [[ -z "$DESTINATION_REPO" ]]; then
            echo "::error::DESTINATION_REPO variable is missing"
            exit 1
          fi

      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Checkout Destination Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DESTINATION_REPO }}
          token: ${{ secrets.ALO_GITHUB_TOKEN }}
          ref: main
          path: destination
          persist-credentials: true

      - name: Sync Files
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='destination/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='vercel.json' \
            --exclude='.npmrc' \
            --exclude='.vercel/' \
            ./ destination/

      - name: Commit and Push Changes
        working-directory: destination
        env:
          GIT_ACTOR: ${{ github.actor }}
          GIT_ACTOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$GIT_ACTOR"
          git config user.email \
            "${GIT_ACTOR_ID}+${GIT_ACTOR}@users.noreply.github.com"

          echo "Git User: $(git config user.name)"
          echo "Git Email: $(git config user.email)"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to sync"
            exit 0
          fi

          git commit -m "Auto sync from ${SOURCE_REPO}"
          git push origin HEAD:main

          echo "Sync completed successfully"
