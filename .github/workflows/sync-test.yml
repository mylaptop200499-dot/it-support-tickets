
name: EC2 Auto Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec2-main-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Execute EC2 Deployment Script
        shell: bash
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_SCRIPT_PATH: ${{ vars.DEPLOY_SCRIPT_PATH }}

        run: |
          set -euo pipefail

          echo "Starting deployment on EC2..."
          echo "Instance ID: $INSTANCE_ID"

          # Run deployment as ubuntu user
          PARAMS=$(jq -n \
            --arg cmd "sudo -u ubuntu -H bash $DEPLOY_SCRIPT_PATH" \
            '{commands: [$cmd]}')

          # Execute deployment using AWS SSM
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --timeout-seconds 3600 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS="Pending"
          RESULT=""

          # Poll deployment status
          for attempt in {1..300}; do

            if ! RESULT=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json 2>/dev/null); then

              echo "Waiting for SSM invocation..."
              sleep 10
              continue
            fi

            STATUS=$(jq -r '.Status' <<< "$RESULT")

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                if [[ "$STATUS" != "Cancelling" ]]; then
                  break
                fi
                ;;
            esac

            sleep 10
          done

          # Retrieve final deployment results
          if [[ -z "$RESULT" ]]; then
            echo "Unable to retrieve SSM deployment results"
            exit 1
          fi

          RESULT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json)

          STATUS=$(jq -r '.Status' <<< "$RESULT")
          EXIT_CODE=$(jq -r '.ResponseCode' <<< "$RESULT")

          echo "========== DEPLOYMENT LOGS =========="
          jq -r '.StandardOutputContent // ""' <<< "$RESULT"

          echo "========== ERROR LOGS =========="
          jq -r '.StandardErrorContent // ""' <<< "$RESULT"

          echo "========== FINAL RESULT =========="
          echo "Status: $STATUS"
          echo "Exit Code: $EXIT_CODE"

          if [[ "$STATUS" == "Success" && "$EXIT_CODE" == "0" ]]; then

            echo "DEPLOYMENT COMPLETED SUCCESSFULLY"

            {
              echo "## Deployment Successful"
              echo ""
              echo "- Branch: main"
              echo "- Instance: $INSTANCE_ID"
              echo "- Status: $STATUS"
              echo "- Exit code: $EXIT_CODE"
            } >> "$GITHUB_STEP_SUMMARY"

          else

            echo "DEPLOYMENT FAILED"

            {
              echo "## Deployment Failed"
              echo ""
              echo "- Branch: main"
              echo "- Instance: $INSTANCE_ID"
              echo "- Status: $STATUS"
              echo "- Exit code: $EXIT_CODE"
            } >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi
