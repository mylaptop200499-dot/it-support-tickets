
name: Sync Code to Vercel Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-to-vercel
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Checkout Destination Repository
        uses: actions/checkout@v4
        with:
          repository: Sardin-learning/it-support-tickets-vercel
          token: ${{ secrets.ALO_GITHUB_TOKEN }}
          ref: main
          path: destination
          persist-credentials: true

      - name: Sync Files
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='destination/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='vercel.json' \
            --exclude='.npmrc' \
            --exclude='.vercel/' \
            ./ destination/

      - name: Commit and Push Changes
        working-directory: destination
        run: |
          git config user.name "alo-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to sync"
            exit 0
          fi

          git commit -m "Auto sync from it-support-tickets"
          git push origin HEAD:main
